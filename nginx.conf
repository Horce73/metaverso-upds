server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan hash de contenido en el nombre: si cambia el contenido,
    # cambia el nombre. Se pueden cachear para siempre sin riesgo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html NO se puede cachear: es quien apunta al bundle vigente.
    # Sin una cabecera explicita el navegador aplica cache heuristica sobre
    # Last-Modified y sigue pidiendo el bundle anterior tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Soporte para SPA (Single Page Application - React Router / Vite)
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para las rutas API REST del Backend
    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso para WebSockets (Socket.io)
    # Los timeouts por defecto de nginx son 60s: sin ampliarlos, la conexion
    # se corta sola cuando hay poco trafico y el usuario "desaparece" del espacio.
    location /socket.io {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Proxy inverso para PeerJS (senalizacion WebRTC del canal de voz)
    # Si este WebSocket se cae, el peer sigue "vivo" en el navegador pero
    # invisible para el servidor: nadie puede volver a llamarlo.
    location /peer {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
