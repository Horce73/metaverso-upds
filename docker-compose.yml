services:
  db:
    image: postgres:15-alpine
    container_name: metaverso_upds_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metaverso_upds
    ports:
      - "5432:5432"
    volumes:
      # El esquema lo crea el backend al arrancar con server/migrations (OPS-04),
      # no un script de inicializacion que solo corre con el volumen vacio.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: metaverso_upds_backend
    restart: always
    ports:
      - "3001:3001"
    # Toda la configuracion vive en server/.env, el mismo archivo que usa
    # `npm run dev`. Sin esto habria que mantener dos copias: la interpolacion
    # ${VAR} de compose lee el .env de la raiz, no el de server/.
    env_file:
      - path: ./server/.env
        required: false
    # Estos valores pisan al env_file: dentro de la red de compose la base
    # responde en el host `db`, no en localhost.
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/metaverso_upds
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metaverso_upds_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: metaverso_upds_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres_data:
