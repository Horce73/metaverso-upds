services:
  db:
    image: postgres:15-alpine
    container_name: metaverso_upds_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metaverso_upds
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: metaverso_upds_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=upds-metaverso-super-secret-key-2026
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/metaverso_upds
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metaverso_upds_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: metaverso_upds_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres_data:
