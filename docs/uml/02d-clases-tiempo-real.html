<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clases — servidor de tiempo real y cliente de voz</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Sólo para la vista previa en el navegador; la exportación toma el <svg>. */
    body { margin: 0; padding: 2rem; background: #f5f5f5; font-family: 'Geist', 'Noto Sans', sans-serif; color: #2d3142; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: #4f5d75; margin: 0 0 .4rem; }
    h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.9rem; margin: 0 0 1.2rem; }
    svg[data-uml] { display: block; background: #fff; border: 1px solid rgba(45,49,66,.12); max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <p class="eyebrow">Diagrama de clases · apaisado · UML 2.x</p>
  <h1>Clases — servidor de tiempo real y cliente de voz</h1>

  <!-- Un <svg data-uml="slug"> por diagrama. El slug es el nombre del archivo exportado. -->
  <svg data-uml="clases-tiempo-real" viewBox="0 0 1040 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clases-tiempo-real-titulo clases-tiempo-real-desc">
    <title id="clases-tiempo-real-titulo">Clases — servidor de tiempo real y cliente de voz</title>
    <desc id="clases-tiempo-real-desc">Estructuras en memoria del servidor de tiempo real (identidad del socket, estado de cada usuario, pases de aula y los módulos que las usan) y la clase AudioClient del navegador.</desc>
    <style>
      text { font-family: 'Geist', 'Noto Sans', sans-serif; fill: #2d3142; }
      .nombre { font-size: 13px; font-weight: 600; }
      .abstracta { font-style: italic; }
      .estereotipo { font-size: 11px; fill: #4f5d75; }
      .miembro { font-family: 'Geist Mono', 'Noto Sans Mono', monospace; font-size: 10.5px; }
      .estatico { text-decoration: underline; }
      .rotulo { font-size: 10.5px; fill: #4f5d75; }
      .mult { font-family: 'Geist Mono', 'Noto Sans Mono', monospace; font-size: 10px; fill: #4f5d75; }
      .operador { font-family: 'Geist Mono', 'Noto Sans Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
      .titulo-marco { font-size: 11px; font-weight: 600; }
      .nota-texto { font-size: 10.5px; fill: #4f5d75; }

      .fondo { fill: #ffffff; }
      .caja { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
      .caja.focal { fill: rgba(235,108,54,.08); stroke: #eb6c36; }
      .caja.externa { fill: rgba(45,49,66,.03); stroke: rgba(45,49,66,.45); }
      .separador { stroke: #2d3142; stroke-width: .8; }
      .marco { fill: rgba(45,49,66,.025); stroke: rgba(45,49,66,.40); stroke-width: 1; }
      .nota { fill: #ffffff; stroke: #4f5d75; stroke-width: .8; }
      .mascara { fill: #ffffff; }

      .linea { fill: none; stroke: #2d3142; stroke-width: 1; }
      .discontinua { stroke-dasharray: 5 4; }
      .linea-vida { stroke: rgba(45,49,66,.40); stroke-width: 1; stroke-dasharray: 4 4; }
      .activacion { fill: #ffffff; stroke: #2d3142; stroke-width: .8; }
      .divisor { stroke: rgba(45,49,66,.45); stroke-width: .8; stroke-dasharray: 5 4; }
      .solido { fill: #2d3142; }
    </style>
    <defs>
      <!-- Punta abierta: navegabilidad, dependencia, mensaje asíncrono, transición -->
      <marker id="flecha-abierta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polyline points="0 0.5, 10 5, 0 9.5" fill="none" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <!-- Punta llena: mensaje síncrono y su respuesta -->
      <marker id="flecha-llena" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0 1, 10 5, 0 9" fill="#2d3142"/>
      </marker>
      <!-- Triángulo hueco: generalización (línea continua) y realización (discontinua) -->
      <marker id="triangulo" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0.5 0.5, 13.5 7, 0.5 13.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <!-- Rombos: van en el extremo del TODO. Sirven como marker-start (path que sale del todo) o marker-end (path que llega al todo). -->
      <marker id="rombo-lleno" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0 5, 9 0.5, 18 5, 9 9.5" fill="#2d3142"/>
      </marker>
      <marker id="rombo-hueco" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0.5 5, 9 0.5, 17.5 5, 9 9.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <!-- Pata de gallo (ER). Se dibujan con la entidad a la derecha (x = 20):
           sirven como marker-end y, por auto-start-reverse, también como marker-start. -->
      <marker id="er-uno" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <line x1="10" y1="2" x2="10" y2="14" stroke="#2d3142" stroke-width="1"/>
        <line x1="14" y1="2" x2="14" y2="14" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <marker id="er-cero-uno" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <circle cx="6" cy="8" r="3.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="14" y1="2" x2="14" y2="14" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <marker id="er-cero-muchos" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <circle cx="5" cy="8" r="3.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <polyline points="20 1.5, 11 8, 20 14.5" fill="none" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <marker id="er-uno-muchos" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <line x1="7" y1="2" x2="7" y2="14" stroke="#2d3142" stroke-width="1"/>
        <polyline points="20 1.5, 11 8, 20 14.5" fill="none" stroke="#2d3142" stroke-width="1"/>
      </marker>
    </defs>

    <rect class="fondo" x="0" y="0" width="1040" height="544"/>


<g class="contenedor">
  <rect x="16" y="16" width="672" height="512" fill="none"/>
  <rect class="marco" x="16" y="36" width="672" height="492"/>
  <path class="marco" d="M 16 36 V 16 H 256 V 36"/>
  <text class="titulo-marco" x="26" y="30">Servidor de tiempo real (memoria)</text>
</g>
<g class="contenedor">
  <rect x="704" y="16" width="328" height="340" fill="none"/>
  <rect class="marco" x="704" y="36" width="328" height="320"/>
  <path class="marco" d="M 704 36 V 16 H 852 V 36"/>
  <text class="titulo-marco" x="714" y="30">Cliente (navegador)</text>
</g>
<path class="linea conector discontinua" data-desde="socket" data-hacia="helpers" d="M 320 110 H 392" marker-end="url(#flecha-abierta)"/>
<path class="linea conector" data-desde="socket" data-hacia="userstate" d="M 96 184 V 244" marker-end="url(#flecha-abierta)"/>
<path class="linea conector discontinua" data-desde="socket" data-hacia="identidad" d="M 296 184 V 244" marker-end="url(#flecha-abierta)"/>
<path class="linea conector discontinua" data-desde="socket" data-hacia="pases" d="M 312 184 V 196 Q 312 202 318 202 H 442 Q 448 202 448 208 V 400" marker-end="url(#flecha-abierta)"/>
<path class="linea conector discontinua" data-desde="helpers" data-hacia="ext-asistencia" d="M 496 172 V 232" marker-end="url(#flecha-abierta)"/>
<path class="linea conector discontinua" data-desde="helpers" data-hacia="ext-tramo" d="M 664 172 V 300" marker-end="url(#flecha-abierta)"/>
<g class="etiqueta">
  <rect class="mascara" x="334.3" y="93" width="43.4" height="14"/>
  <text class="rotulo" x="356" y="104" text-anchor="middle">«call»</text>
</g>
<text class="mult" x="102" y="200">1</text>
<text class="rotulo" x="102" y="218">activeUsers</text>
<text class="mult" x="102" y="236">0..*</text>
<text class="rotulo" x="302" y="222">«create»</text>
<g class="etiqueta">
  <rect class="mascara" x="369.25" y="185" width="37.5" height="14"/>
  <text class="rotulo" x="388" y="196" text-anchor="middle">«use»</text>
</g>
<text class="rotulo" x="502" y="208">«create»</text>
<text class="rotulo" x="658" y="286" text-anchor="end">«create»</text>
<g class="nodo" id="socket">
  <rect class="caja" x="32" y="56" width="288" height="128"/>
  <text class="estereotipo" x="176" y="71" text-anchor="middle">«utility»</text>
  <text class="nombre" x="176" y="88" text-anchor="middle">socketHandler</text>
  <line class="separador" x1="32" y1="96" x2="320" y2="96"/>
  <text class="miembro estatico" x="42" y="114">- activeUsers: Map&lt;string, UserState&gt;</text>
  <line class="separador" x1="32" y1="124" x2="320" y2="124"/>
  <text class="miembro estatico" x="42" y="142">+ setupSockets(io)</text>
  <text class="miembro estatico" x="42" y="158">+ registrarPresentesEnAula(espacioId)</text>
  <text class="miembro estatico" x="42" y="174">- resolverIdentidad(token)</text>
</g>
<g class="nodo" id="helpers">
  <rect class="caja" x="392" y="56" width="280" height="116"/>
  <text class="estereotipo" x="532" y="71" text-anchor="middle">«utility»</text>
  <text class="nombre" x="532" y="88" text-anchor="middle">helpers</text>
  <line class="separador" x1="392" y1="96" x2="672" y2="96"/>
  <text class="miembro estatico" x="402" y="114">+ registrarAsistencia(userId, espacioId)</text>
  <text class="miembro estatico" x="402" y="130">+ registrarSalida(userId, espacioId)</text>
  <text class="miembro estatico" x="402" y="146">+ cerrarTramosDeSesion(sesionId)</text>
  <text class="miembro estatico" x="402" y="162">+ bitacora(usuarioId, evento, detalle, ip)</text>
</g>
<g class="nodo" id="userstate">
  <rect class="caja" x="32" y="244" width="216" height="212"/>
  <text class="estereotipo" x="140" y="259" text-anchor="middle">«interface»</text>
  <text class="nombre" x="140" y="276" text-anchor="middle">UserState</text>
  <line class="separador" x1="32" y1="284" x2="248" y2="284"/>
  <text class="miembro" x="42" y="302">+ userId: number</text>
  <text class="miembro" x="42" y="318">+ nombreVisible: string</text>
  <text class="miembro" x="42" y="334">+ espacioId: number</text>
  <text class="miembro" x="42" y="350">+ espacioTipo: 'campus' | 'aula'</text>
  <text class="miembro" x="42" y="366">+ position: number[3]</text>
  <text class="miembro" x="42" y="382">+ rotation: number[3]</text>
  <text class="miembro" x="42" y="398">+ estaSentado: boolean</text>
  <text class="miembro" x="42" y="414">+ apariencia: any</text>
  <text class="miembro" x="42" y="430">+ peerId: string [0..1]</text>
  <text class="miembro" x="42" y="446">+ roles: string[]</text>
</g>
<g class="nodo" id="identidad">
  <rect class="caja" x="280" y="244" width="152" height="116"/>
  <text class="estereotipo" x="356" y="259" text-anchor="middle">«interface»</text>
  <text class="nombre" x="356" y="276" text-anchor="middle">Identidad</text>
  <line class="separador" x1="280" y1="284" x2="432" y2="284"/>
  <text class="miembro" x="290" y="302">+ userId: number</text>
  <text class="miembro" x="290" y="318">+ esInvitado: boolean</text>
  <text class="miembro" x="290" y="334">+ nombre: string</text>
  <text class="miembro" x="290" y="350">+ roles: string[]</text>
</g>
<g class="nodo" id="pases">
  <rect class="caja focal" x="280" y="400" width="260" height="100"/>
  <text class="nombre" x="410" y="419" text-anchor="middle">Pases</text>
  <line class="separador" x1="280" y1="428" x2="540" y2="428"/>
  <text class="miembro" x="290" y="446">- vencen: Map&lt;string, number&gt;</text>
  <line class="separador" x1="280" y1="456" x2="540" y2="456"/>
  <text class="miembro" x="290" y="474">+ otorgar(usuarioId, espacioId, ahora)</text>
  <text class="miembro" x="290" y="490">+ tiene(usuarioId, espacioId, ahora)</text>
</g>
<g class="nodo" id="ext-asistencia">
  <rect class="caja externa" x="468" y="232" width="180" height="28"/>
  <text class="nombre" x="558" y="251" text-anchor="middle">Espacios::Asistencia</text>
</g>
<g class="nodo" id="ext-tramo">
  <rect class="caja externa" x="460" y="300" width="220" height="28"/>
  <text class="nombre" x="570" y="319" text-anchor="middle">Espacios::AsistenciaTramo</text>
</g>
<g class="nodo" id="audio">
  <rect class="caja" x="712" y="56" width="312" height="276"/>
  <text class="nombre" x="868" y="75" text-anchor="middle">AudioClient</text>
  <line class="separador" x1="712" y1="84" x2="1024" y2="84"/>
  <text class="miembro" x="722" y="102">- peer: Peer [0..1]</text>
  <text class="miembro" x="722" y="118">- localStream: MediaStream [0..1]</text>
  <text class="miembro" x="722" y="134">- audioCtx: AudioContext [0..1]</text>
  <text class="miembro" x="722" y="150">- activeCalls: Map&lt;string, any&gt;</text>
  <text class="miembro" x="722" y="166">- zona: 'campus' | 'aula' [0..1]</text>
  <text class="miembro" x="722" y="182">- soyDifusor: boolean</text>
  <line class="separador" x1="712" y1="192" x2="1024" y2="192"/>
  <text class="miembro" x="722" y="210">+ callUser(remotePeerId, retries)</text>
  <text class="miembro" x="722" y="226">+ configurarZonas(tipo, soyDifusor)</text>
  <text class="miembro" x="722" y="242">+ registrarParticipante(remotePeerId, difunde)</text>
  <text class="miembro" x="722" y="258">+ updateListenerPosition(position, rotation)</text>
  <text class="miembro" x="722" y="274">+ setMute(muted)</text>
  <text class="miembro" x="722" y="290">+ destroy()</text>
  <text class="miembro" x="722" y="306">- obtenerIceServers()</text>
  <text class="miembro" x="722" y="322">- sincronizarZonas()</text>
</g>

  </svg>
</body>
</html>
