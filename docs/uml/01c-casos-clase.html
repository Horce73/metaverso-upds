<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casos de uso — conducción de la clase y administración</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Sólo para la vista previa en el navegador; la exportación toma el <svg>. */
    body { margin: 0; padding: 2rem; background: #f5f5f5; font-family: 'Geist', 'Noto Sans', sans-serif; color: #2d3142; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: #4f5d75; margin: 0 0 .4rem; }
    h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.9rem; margin: 0 0 1.2rem; }
    svg[data-uml] { display: block; background: #fff; border: 1px solid rgba(45,49,66,.12); max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <p class="eyebrow">Casos de uso · apaisado · UML 2.x</p>
  <h1>Casos de uso — conducción de la clase y administración</h1>

  <!-- Un <svg data-uml="slug"> por diagrama. El slug es el nombre del archivo exportado. -->
  <svg data-uml="casos-clase" viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="casos-clase-titulo casos-clase-desc">
    <title id="casos-clase-titulo">Casos de uso — conducción de la clase y administración</title>
    <desc id="casos-clase-desc">Casos de uso del docente y del administrador: iniciar la clase (que incluye registrar asistencia), finalizarla, moderar el aula, materiales, reportes y administración.</desc>
    <style>
      text { font-family: 'Geist', 'Noto Sans', sans-serif; fill: #2d3142; }
      .nombre { font-size: 13px; font-weight: 600; }
      .abstracta { font-style: italic; }
      .estereotipo { font-size: 11px; fill: #4f5d75; }
      .miembro { font-family: 'Geist Mono', 'Noto Sans Mono', monospace; font-size: 10.5px; }
      .estatico { text-decoration: underline; }
      .rotulo { font-size: 10.5px; fill: #4f5d75; }
      .mult { font-family: 'Geist Mono', 'Noto Sans Mono', monospace; font-size: 10px; fill: #4f5d75; }
      .operador { font-family: 'Geist Mono', 'Noto Sans Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
      .titulo-marco { font-size: 11px; font-weight: 600; }
      .nota-texto { font-size: 10.5px; fill: #4f5d75; }

      .fondo { fill: #ffffff; }
      .caja { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
      .caja.focal { fill: rgba(235,108,54,.08); stroke: #eb6c36; }
      .caja.externa { fill: rgba(45,49,66,.03); stroke: rgba(45,49,66,.45); }
      .separador { stroke: #2d3142; stroke-width: .8; }
      .marco { fill: rgba(45,49,66,.025); stroke: rgba(45,49,66,.40); stroke-width: 1; }
      .nota { fill: #ffffff; stroke: #4f5d75; stroke-width: .8; }
      .mascara { fill: #ffffff; }

      .linea { fill: none; stroke: #2d3142; stroke-width: 1; }
      .discontinua { stroke-dasharray: 5 4; }
      .linea-vida { stroke: rgba(45,49,66,.40); stroke-width: 1; stroke-dasharray: 4 4; }
      .activacion { fill: #ffffff; stroke: #2d3142; stroke-width: .8; }
      .divisor { stroke: rgba(45,49,66,.45); stroke-width: .8; stroke-dasharray: 5 4; }
      .solido { fill: #2d3142; }
    </style>
    <defs>
      <!-- Punta abierta: navegabilidad, dependencia, mensaje asíncrono, transición -->
      <marker id="flecha-abierta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polyline points="0 0.5, 10 5, 0 9.5" fill="none" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <!-- Punta llena: mensaje síncrono y su respuesta -->
      <marker id="flecha-llena" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0 1, 10 5, 0 9" fill="#2d3142"/>
      </marker>
      <!-- Triángulo hueco: generalización (línea continua) y realización (discontinua) -->
      <marker id="triangulo" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0.5 0.5, 13.5 7, 0.5 13.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <!-- Rombos: van en el extremo del TODO. Sirven como marker-start (path que sale del todo) o marker-end (path que llega al todo). -->
      <marker id="rombo-lleno" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0 5, 9 0.5, 18 5, 9 9.5" fill="#2d3142"/>
      </marker>
      <marker id="rombo-hueco" viewBox="0 0 18 10" refX="18" refY="5" markerWidth="18" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <polygon points="0.5 5, 9 0.5, 17.5 5, 9 9.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <!-- Pata de gallo (ER). Se dibujan con la entidad a la derecha (x = 20):
           sirven como marker-end y, por auto-start-reverse, también como marker-start. -->
      <marker id="er-uno" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <line x1="10" y1="2" x2="10" y2="14" stroke="#2d3142" stroke-width="1"/>
        <line x1="14" y1="2" x2="14" y2="14" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <marker id="er-cero-uno" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <circle cx="6" cy="8" r="3.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="14" y1="2" x2="14" y2="14" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <marker id="er-cero-muchos" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <circle cx="5" cy="8" r="3.5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <polyline points="20 1.5, 11 8, 20 14.5" fill="none" stroke="#2d3142" stroke-width="1"/>
      </marker>
      <marker id="er-uno-muchos" viewBox="0 0 20 16" refX="20" refY="8" markerWidth="20" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <line x1="7" y1="2" x2="7" y2="14" stroke="#2d3142" stroke-width="1"/>
        <polyline points="20 1.5, 11 8, 20 14.5" fill="none" stroke="#2d3142" stroke-width="1"/>
      </marker>
    </defs>

    <rect class="fondo" x="0" y="0" width="1040" height="680"/>


<g class="contenedor">
  <rect class="marco" x="170" y="16" width="710" height="648"/>
  <text class="titulo-marco" x="182" y="34">Metaverso UPDS</text>
</g>
<path class="linea conector discontinua" data-desde="uc-iniciar" data-hacia="uc-asistencia" d="M 396 80 H 468" marker-end="url(#flecha-abierta)"/>
<path class="linea conector" data-desde="docente" data-hacia="uc-iniciar" d="M 90 318 L 244 80"/>
<path class="linea conector" data-desde="docente" data-hacia="uc-responder" d="M 90 324 L 220 172"/>
<path class="linea conector" data-desde="docente" data-hacia="uc-material" d="M 90 330 L 200 260"/>
<path class="linea conector" data-desde="docente" data-hacia="uc-reportes" d="M 90 336 L 764 370"/>
<path class="linea conector" data-desde="docente" data-hacia="uc-moderar" d="M 90 342 L 528 370"/>
<path class="linea conector" data-desde="docente" data-hacia="uc-finalizar" d="M 90 348 L 320 378"/>
<path class="linea conector" data-desde="admin" data-hacia="uc-crud" d="M 950 528 L 836 150"/>
<path class="linea conector" data-desde="admin" data-hacia="uc-resolver" d="M 950 534 L 844 232"/>
<path class="linea conector" data-desde="admin" data-hacia="uc-bitacora" d="M 950 540 L 848 314"/>
<path class="linea conector" data-desde="admin" data-hacia="uc-reportes" d="M 950 546 L 764 430"/>
<path class="linea conector" data-desde="admin" data-hacia="uc-moderar" d="M 950 552 L 528 430"/>
<path class="linea conector" data-desde="admin" data-hacia="uc-finalizar" d="M 950 558 L 320 422"/>
<g class="etiqueta">
  <rect class="mascara" x="401.45" y="62" width="61.1" height="14"/>
  <text class="rotulo" x="432" y="73" text-anchor="middle">«include»</text>
</g>
<g class="nodo" id="docente">
  <rect x="40" y="300" width="64" height="80" fill="none"/>
  <circle class="caja" cx="72" cy="310" r="8"/>
  <path class="linea" d="M 72 318 V 342 M 58 326 H 86 M 72 342 L 61 358 M 72 342 L 83 358"/>
  <text class="nombre" x="72" y="376" text-anchor="middle">Docente</text>
</g>
<g class="nodo" id="admin">
  <rect x="912" y="520" width="112" height="80" fill="none"/>
  <circle class="caja" cx="968" cy="530" r="8"/>
  <path class="linea" d="M 968 538 V 562 M 954 546 H 982 M 968 562 L 957 578 M 968 562 L 979 578"/>
  <text class="nombre" x="968" y="596" text-anchor="middle">Administrador</text>
</g>
<g class="nodo" id="uc-iniciar">
  <ellipse class="caja" cx="320" cy="80" rx="76" ry="22"/>
  <text class="nombre" x="320" y="85" text-anchor="middle">Iniciar clase</text>
</g>
<g class="nodo" id="uc-asistencia">
  <ellipse class="caja" cx="572" cy="80" rx="104" ry="22"/>
  <text class="nombre" x="572" y="85" text-anchor="middle">Registrar asistencia</text>
</g>
<g class="nodo" id="uc-responder">
  <ellipse class="caja" cx="320" cy="172" rx="100" ry="30"/>
  <text class="nombre" x="320" y="169" text-anchor="middle">Responder solicitud</text>
  <text class="nombre" x="320" y="185" text-anchor="middle">de acceso</text>
</g>
<g class="nodo" id="uc-material">
  <ellipse class="caja" cx="320" cy="260" rx="120" ry="22"/>
  <text class="nombre" x="320" y="265" text-anchor="middle">Subir y mostrar material</text>
</g>
<g class="nodo" id="uc-finalizar">
  <ellipse class="caja" cx="320" cy="400" rx="84" ry="22"/>
  <text class="nombre" x="320" y="405" text-anchor="middle">Finalizar clase</text>
</g>
<g class="nodo" id="uc-moderar">
  <ellipse class="caja" cx="528" cy="400" rx="108" ry="30"/>
  <text class="nombre" x="528" y="397" text-anchor="middle">Moderar el aula</text>
  <text class="nombre" x="528" y="413" text-anchor="middle">(palabra, encuestas…)</text>
</g>
<g class="nodo" id="uc-reportes">
  <ellipse class="caja" cx="764" cy="400" rx="104" ry="30"/>
  <text class="nombre" x="764" y="397" text-anchor="middle">Consultar asistencia</text>
  <text class="nombre" x="764" y="413" text-anchor="middle">y actas</text>
</g>
<g class="nodo" id="uc-crud">
  <ellipse class="caja" cx="740" cy="150" rx="96" ry="30"/>
  <text class="nombre" x="740" y="147" text-anchor="middle">Gestionar usuarios</text>
  <text class="nombre" x="740" y="163" text-anchor="middle">y catálogos</text>
</g>
<g class="nodo" id="uc-resolver">
  <ellipse class="caja" cx="740" cy="232" rx="104" ry="30"/>
  <text class="nombre" x="740" y="229" text-anchor="middle">Resolver solicitudes</text>
  <text class="nombre" x="740" y="245" text-anchor="middle">de docente</text>
</g>
<g class="nodo" id="uc-bitacora">
  <ellipse class="caja" cx="740" cy="314" rx="108" ry="30"/>
  <text class="nombre" x="740" y="311" text-anchor="middle">Consultar bitácora,</text>
  <text class="nombre" x="740" y="327" text-anchor="middle">panel y mapa de calor</text>
</g>

  </svg>
</body>
</html>
